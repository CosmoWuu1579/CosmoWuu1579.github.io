<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handouts — Cosmo Wu</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-content">
            <a href="index.html" class="logo">CW</a>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="experience.html">Experience</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="notes.html">Notes</a></li>
                <li><a href="handouts.html">Handouts</a></li>
            </ul>
        </div>
    </nav>

    <section id="handouts">
        <h2 class="section-title">Handouts</h2>
        <p class="section-subtitle">Problem sets and worksheets I've written. Click any handout to view it inline.</p>

        <div id="handout-list" class="post-grid">
            <p style="color: var(--gray); grid-column: 1 / -1; text-align: center;">Loading handouts…</p>
        </div>

        <div id="viewer-wrap" class="pdf-viewer-wrap" style="display: none;">
            <div class="pdf-viewer-toolbar">
                <h3 id="viewer-title"></h3>
                <div style="display: flex; gap: 0.5rem;">
                    <a id="viewer-download" href="#" download>Download</a>
                    <a id="viewer-close" href="#" onclick="closeViewer(); return false;">Close</a>
                </div>
            </div>
            <iframe id="viewer-frame" class="pdf-viewer" title="PDF viewer"></iframe>
        </div>
    </section>

    <script src="assets/js/main.js"></script>
    <script>
        let handoutsCache = [];

        (async function () {
            const list = document.getElementById('handout-list');
            try {
                const res = await fetch('handouts/handouts.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const handouts = await res.json();
                handoutsCache = Array.isArray(handouts) ? handouts : [];

                if (handoutsCache.length === 0) {
                    list.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;">No handouts yet. Drop a PDF into the <code>handouts/</code> folder and add an entry to <code>handouts/handouts.json</code>.</div>';
                    return;
                }

                handoutsCache.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

                list.innerHTML = handoutsCache.map((h, i) => {
                    const tags = (h.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
                    const meta = [h.subject, h.difficulty, h.date].filter(Boolean).map(x => `<span>${escapeHtml(x)}</span>`).join('');
                    return `
                        <a class="post-card" href="#" onclick="openViewer(${i}); return false;">
                            <div class="post-card-meta">${meta}</div>
                            <div class="post-card-title">${escapeHtml(h.title)}</div>
                            <div class="post-card-summary">${escapeHtml(h.summary || '')}</div>
                            <div class="post-card-tags">${tags}</div>
                        </a>
                    `;
                }).join('');

                document.querySelectorAll('.post-card').forEach(el => el.classList.add('animate-in'));

                const params = new URLSearchParams(window.location.search);
                const requested = params.get('handout');
                if (requested) {
                    const idx = handoutsCache.findIndex(h => h.file === requested);
                    if (idx >= 0) openViewer(idx);
                }
            } catch (err) {
                list.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        Could not load handouts. If you're viewing locally, open via a server (e.g. <code>python -m http.server</code>) instead of <code>file://</code>.
                    </div>`;
                console.error(err);
            }
        })();

        function openViewer(index) {
            const handout = handoutsCache[index];
            if (!handout) return;
            const url = 'handouts/' + handout.file;
            document.getElementById('viewer-title').textContent = handout.title;
            document.getElementById('viewer-frame').src = url;
            document.getElementById('viewer-download').href = url;
            document.getElementById('viewer-download').setAttribute('download', handout.file);
            const wrap = document.getElementById('viewer-wrap');
            wrap.style.display = 'block';
            wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });

            const params = new URLSearchParams(window.location.search);
            params.set('handout', handout.file);
            history.replaceState(null, '', '?' + params.toString());
        }

        function closeViewer() {
            const wrap = document.getElementById('viewer-wrap');
            wrap.style.display = 'none';
            document.getElementById('viewer-frame').src = '';
            history.replaceState(null, '', window.location.pathname);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
    </script>
</body>
</html>
