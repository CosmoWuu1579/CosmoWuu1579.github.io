<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/qft_pfp.png">
    <link rel="apple-touch-icon" href="/qft_pfp.png">
    <title>Blog — Cosmo Wu</title>

    <script>(function(){try{var t=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',t||(d?'dark':'light'));}catch(e){document.documentElement.setAttribute('data-theme','light');}try{var p=location.pathname;if(p.endsWith('/index.html')){history.replaceState(null,'',p.slice(0,-10)+location.search+location.hash);}}catch(e){}})();</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/assets/css/style.css?v=4">
</head>
<body>
    <nav class="nav">
        <div class="nav-content">
            <a href="/" class="logo">Cosmo Wu<span class="logo-dot">.</span></a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="/">About</a></li>
                    <li><a href="/experience/">Experience</a></li>
                    <li><a href="/projects/">Projects</a></li>
                    <li><a href="/dreu/">DREU</a></li>
                    <li><a href="/blog/">Blog</a></li>
                    <li><a href="/notes/">Notes</a></li>
                    <li><a href="/handouts/">Handouts</a></li>
                </ul>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <section id="blog">
        <div class="section-head">
            <p class="eyebrow">Writing</p>
            <h2 class="section-title">Blog</h2>
            <p class="section-subtitle">Notes on what I'm learning, building, and thinking about.</p>
        </div>

        <div id="post-list" class="post-grid">
            <p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center;">Loading posts…</p>
        </div>
    </section>

    <script src="/assets/js/main.js?v=4"></script>
    <script>
        (async function () {
            const list = document.getElementById('post-list');
            try {
                const res = await fetch('/blog/posts.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const posts = await res.json();

                if (!Array.isArray(posts) || posts.length === 0) {
                    list.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;">No posts yet. Add entries to <code>blog/posts.json</code>.</div>';
                    return;
                }

                posts.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

                list.innerHTML = posts.map(p => {
                    const tags = (p.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
                    const date = p.date ? `<span>${escapeHtml(p.date)}</span>` : '';
                    const readTime = p.readTime ? `<span>${escapeHtml(p.readTime)}</span>` : '';
                    return `
                        <a class="post-card" href="${escapeAttr(p.url)}">
                            <div class="post-card-meta">${date}${readTime}</div>
                            <div class="post-card-title">${escapeHtml(p.title)}</div>
                            <div class="post-card-summary">${escapeHtml(p.summary || '')}</div>
                            <div class="post-card-tags">${tags}</div>
                        </a>
                    `;
                }).join('');

                // re-observe newly added cards for fade-in animation
                document.querySelectorAll('.post-card').forEach(el => el.classList.add('animate-in'));
            } catch (err) {
                list.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        Could not load posts. If you're viewing locally, open via a server (e.g. <code>python -m http.server</code>) instead of <code>file://</code>.
                    </div>`;
                console.error(err);
            }
        })();

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function escapeAttr(s) { return escapeHtml(s); }
    </script>
</body>
</html>
