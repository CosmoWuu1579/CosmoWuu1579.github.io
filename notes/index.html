<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/qft_pfp.png">
    <link rel="apple-touch-icon" href="/qft_pfp.png">
    <title>Notes — Cosmo Wu</title>

    <script>(function(){try{var t=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',t||(d?'dark':'light'));}catch(e){document.documentElement.setAttribute('data-theme','light');}try{var p=location.pathname;if(p.endsWith('/index.html')){history.replaceState(null,'',p.slice(0,-10)+location.search+location.hash);}}catch(e){}})();</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-content">
            <a href="/" class="logo">Cosmo Wu<span class="logo-dot">.</span></a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="/">About</a></li>
                    <li><a href="/experience/">Experience</a></li>
                    <li><a href="/projects/">Projects</a></li>
                    <li><a href="/dreu/">DREU</a></li>
                    <li><a href="/blog/">Blog</a></li>
                    <li><a href="/notes/">Notes</a></li>
                    <li><a href="/handouts/">Handouts</a></li>
                </ul>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <section id="notes">
        <div class="section-head">
            <p class="eyebrow">Library</p>
            <h2 class="section-title">Notes</h2>
            <p class="section-subtitle">Course notes, reference sheets, and other PDFs. Click any note to view it inline.</p>
        </div>

        <div id="note-list" class="post-grid">
            <p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center;">Loading notes…</p>
        </div>

        <div id="viewer-wrap" class="pdf-viewer-wrap" style="display: none;">
            <div class="pdf-viewer-toolbar">
                <h3 id="viewer-title"></h3>
                <div style="display: flex; gap: 0.5rem;">
                    <a id="viewer-download" href="#" download>Download</a>
                    <a id="viewer-close" href="#" onclick="closeViewer(); return false;">Close</a>
                </div>
            </div>
            <iframe id="viewer-frame" class="pdf-viewer" title="PDF viewer"></iframe>
        </div>
    </section>

    <script src="/assets/js/main.js"></script>
    <script>
        let notesCache = [];

        (async function () {
            const list = document.getElementById('note-list');
            try {
                const res = await fetch('/notes/notes.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const notes = await res.json();
                notesCache = Array.isArray(notes) ? notes : [];

                if (notesCache.length === 0) {
                    list.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;">No notes yet. Drop a PDF into the <code>notes/</code> folder and add an entry to <code>notes/notes.json</code>.</div>';
                    return;
                }

                notesCache.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

                list.innerHTML = notesCache.map((n, i) => {
                    const tags = (n.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
                    const meta = [n.course, n.date].filter(Boolean).map(x => `<span>${escapeHtml(x)}</span>`).join('');
                    return `
                        <a class="post-card" href="#" onclick="openViewer(${i}); return false;">
                            <div class="post-card-meta">${meta}</div>
                            <div class="post-card-title">${escapeHtml(n.title)}</div>
                            <div class="post-card-summary">${escapeHtml(n.summary || '')}</div>
                            <div class="post-card-tags">${tags}</div>
                        </a>
                    `;
                }).join('');

                document.querySelectorAll('.post-card').forEach(el => el.classList.add('animate-in'));

                // If URL has ?note=filename.pdf, open it directly
                const params = new URLSearchParams(window.location.search);
                const requested = params.get('note');
                if (requested) {
                    const idx = notesCache.findIndex(n => n.file === requested);
                    if (idx >= 0) openViewer(idx);
                }
            } catch (err) {
                list.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        Could not load notes. If you're viewing locally, open via a server (e.g. <code>python -m http.server</code>) instead of <code>file://</code>.
                    </div>`;
                console.error(err);
            }
        })();

        function openViewer(index) {
            const note = notesCache[index];
            if (!note) return;
            const url = '/notes/' + note.file;
            document.getElementById('viewer-title').textContent = note.title;
            document.getElementById('viewer-frame').src = url;
            document.getElementById('viewer-download').href = url;
            document.getElementById('viewer-download').setAttribute('download', note.file);
            const wrap = document.getElementById('viewer-wrap');
            wrap.style.display = 'block';
            wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });

            const params = new URLSearchParams(window.location.search);
            params.set('note', note.file);
            history.replaceState(null, '', '?' + params.toString());
        }

        function closeViewer() {
            const wrap = document.getElementById('viewer-wrap');
            wrap.style.display = 'none';
            document.getElementById('viewer-frame').src = '';
            history.replaceState(null, '', window.location.pathname);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
    </script>
</body>
</html>
